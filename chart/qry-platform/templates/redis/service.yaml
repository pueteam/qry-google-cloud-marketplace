{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.redis.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "qry.redis.selectorLabels" . | nindent 4 }}
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
{{- end }}

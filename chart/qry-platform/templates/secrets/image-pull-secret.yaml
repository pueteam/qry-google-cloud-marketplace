{{- if .Values.imagePullSecret.create }}
{{- if and .Values.imagePullSecret.dockerPassword .Values.imagePullSecret.dockerServer }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":%s,\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.imagePullSecret.dockerServer .Values.imagePullSecret.dockerUsername (.Values.imagePullSecret.dockerPassword | toJson) .Values.imagePullSecret.dockerEmail (printf "%s:%s" .Values.imagePullSecret.dockerUsername .Values.imagePullSecret.dockerPassword | b64enc) | b64enc }}
{{- end }}
{{- end }}

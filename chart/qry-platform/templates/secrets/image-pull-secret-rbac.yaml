{{- if and .Values.imagePullSecret.create .Values.imagePullSecret.dockerPassword .Values.imagePullSecret.dockerServer .Values.serviceAccount.name }}
# The backend writes the license saved in Admin > License into this one pull
# secret (app/services/registry_pull_secret.py): get and patch, on this name
# only. In the Python execution namespace runtime-manager-role already allows it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qry-pull-secret-sync
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ .Values.imagePullSecret.name | quote }}]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qry-pull-secret-sync
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "qry.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qry-pull-secret-sync
{{- end }}

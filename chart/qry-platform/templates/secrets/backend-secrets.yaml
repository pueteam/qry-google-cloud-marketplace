apiVersion: v1
kind: Secret
metadata:
  name: qry-backend-secrets
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Infrastructure connectivity (required at startup)
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  DATABASE_URL: {{ include "qry.databaseUrl" . | quote }}
  REDIS_URL: {{ include "qry.redisUrl" . | quote }}
  # Security settings (JWT + Fernet encryption for datasource credentials).
  # Omitted when backend.secrets.existingSecret supplies it (see values.yaml).
  {{- if not .Values.backend.secrets.existingSecret }}
  {{- $key := required "backend.secrets.secretKey is required (or set backend.secrets.existingSecret). Generate one: openssl rand -base64 48" .Values.backend.secrets.secretKey }}
  {{- if eq $key "qry-secret-key-change-in-production" }}
  {{- fail "backend.secrets.secretKey is the chart's shipped placeholder; every stored credential would be decryptable with a public string. Generate one: openssl rand -base64 48" }}
  {{- end }}
  {{- /* Weak or app-default values are NOT refused here: installations that
         predate this check carry them, and an upgrade must not fail to render.
         The backend logs + exports a metric at startup and `qry doctor` has
         `jwt-secret-is-default` for exactly that. */}}
  JWT_SECRET_KEY: {{ $key | quote }}
  {{- end }}
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS | quote }}
  # Application URLs
  BACKEND_URL: "http://qry-backend:8000"
  # Internal URL used by Python runtimes (which live in a shared namespace,
  # so they need the fully-qualified service DNS of THIS tenant's backend).
  # Derived from the release namespace so each tenant gets its own without
  # extra wiring.
  BACKEND_INTERNAL_URL: {{ printf "http://qry-backend.%s.svc.cluster.local:8000" (include "qry.namespace" .) | quote }}
  FRONTEND_URL: "http://qry-frontend:{{ .Values.frontend.service.port }}"
  # Feature flags
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  # Reverse-proxy chain: which CIDRs are allowed to set X-Forwarded-For.
  # Empty means the Nexus gateway will use req.client.host directly (safe
  # but the API client IP allowlist will see the LB IP rather than the
  # real source). Set to the cluster pod CIDR in production.
  TRUSTED_PROXY_CIDRS: {{ .Values.backend.env.TRUSTED_PROXY_CIDRS | default "" | quote }}
  {{- if and .Values.imagePullSecret.create .Values.imagePullSecret.dockerPassword .Values.imagePullSecret.dockerServer }}
  # The pull secret the backend keeps on the license in Admin > License
  # (app/services/registry_pull_secret.py).
  QRY_IMAGE_PULL_SECRET: {{ .Values.imagePullSecret.name | quote }}
  {{- end }}
  {{- if .Values.pythonExecution.enabled }}
  # Python execution namespace config
  K8S_PYTHON_NAMESPACE: {{ include "qry.pythonExecution.namespace" . | quote }}
  K8S_RUNTIME_SERVICE_ACCOUNT: {{ .Values.pythonExecution.serviceAccountName | quote }}
  {{- if .Values.pythonExecution.singleNamespace }}
  # Notebook sessions in the same namespace as the executor (and Qry).
  K8S_RUNTIME_NAMESPACE: {{ include "qry.pythonExecution.namespace" . | quote }}
  {{- end }}
  {{- end }}
  {{- /* Images Qry starts at run time, when the installation sets them (a
         marketplace rewrites them to its registry); otherwise the versions
         built into the backend image. An admin's Runtime image still wins. */}}
  {{- with .Values.runtimeImages }}
  {{- if .registry }}
  QRY_IMAGE_REGISTRY: {{ .registry | quote }}
  {{- end }}
  {{- if .pythonExecutor }}
  QRY_EXECUTOR_IMAGE: {{ .pythonExecutor | quote }}
  {{- end }}
  {{- if .pythonSession }}
  K8S_RUNTIME_IMAGE: {{ .pythonSession | quote }}
  {{- end }}
  {{- if .gcsfuseSidecar }}
  GCSFUSE_SIDECAR_IMAGE: {{ .gcsfuseSidecar | quote }}
  {{- end }}
  {{- if .mountpointS3Sidecar }}
  MOUNTPOINT_S3_SIDECAR_IMAGE: {{ .mountpointS3Sidecar | quote }}
  {{- end }}
  {{- end }}
  # Note: LICENSE_CREDENTIALS and GOOGLE_APPLICATION_CREDENTIALS are set by
  # RuntimeConfigProvider from database config (Admin > System Settings)
{{- if or .Values.bootstrap.setupCode (include "qry.publicUrl" .) }}
---
# One-time code to create the first administrator (marketplace forms generate
# it). Mounted into the backend as a file, never an environment variable;
# without it the backend writes a code to its log.
apiVersion: v1
kind: Secret
metadata:
  name: qry-bootstrap
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.bootstrap.setupCode }}
  setup-code: {{ .Values.bootstrap.setupCode | quote }}
  {{- end }}
  {{- with (include "qry.publicUrl" .) }}
  public-url: {{ . | quote }}
  {{- end }}
{{- end }}

{{- /* In one namespace the application's own pull secret already serves the
       executor pods; a copy would collide with it. */}}
{{- if and .Values.pythonExecution.enabled (not .Values.pythonExecution.singleNamespace) }}
{{- if .Values.imagePullSecret.create }}
{{- if and .Values.imagePullSecret.dockerPassword .Values.imagePullSecret.dockerServer }}
# Image pull secret for python-execution namespace
# Duplicates the secret from qry-app namespace so executor pods can pull images
{{- $f := include "qry.pullSecretFields" (dict "root" . "namespace" (include "qry.pythonExecution.namespace" .)) | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ include "qry.pythonExecution.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
  {{- with $f.metadata_annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $f.dockerconfigjson }}
{{- end }}
{{- end }}
{{- end }}

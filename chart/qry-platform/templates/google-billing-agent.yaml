{{- /*
Google Cloud Marketplace usage reporting for a plan billed by Google: Google's
metering agent (ubbagent) forwards usage to Service Control, keeps it on disk
and retries, as Google's billing integration guide describes. Two metrics:
`active_users`, people who used Qry for the first time this month, posted every
hour by the reporter beside it (services/marketplace/metering.py), and
`instance_time`, a heartbeat of installation time, priced at 0.01 USD an hour
(Google refuses a metric priced at 0). One pod, one replica, Recreate: a sidecar on the
backend would report once per replica, and a rolling update would briefly run
two. The agent's HTTP API listens on the pod's localhost only and takes reports
from whoever reaches it, so the only other container here is the reporter
(the backend image); people's code never runs in this pod and a network policy
admits no connection to it.
*/}}
{{- $g := .Values.googleMarketplace }}
{{- if and $g.enabled $g.reportingSecret $g.billing.serviceName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-billing-agent
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing-agent
data:
  config.yaml: |
    identities:
    - name: gcp
      gcp:
        encodedServiceAccountKey: $AGENT_ENCODED_KEY
    metrics:
    - name: {{ $g.billing.usersMetric }}
      type: int
      endpoints:
      - name: on_disk
      - name: servicecontrol
      passthrough: {}
    - name: {{ $g.billing.metric }}
      type: int
      endpoints:
      - name: on_disk
      - name: servicecontrol
      passthrough: {}
    endpoints:
    - name: on_disk
      disk:
        reportDir: /var/lib/ubbagent/reports
        expireSeconds: 3600
    - name: servicecontrol
      servicecontrol:
        identity: gcp
        serviceName: {{ $g.billing.serviceName }}
        consumerId: $AGENT_CONSUMER_ID
    sources:
    - name: {{ $g.billing.metric }}_heartbeat
      heartbeat:
        metric: {{ $g.billing.metric }}
        intervalSeconds: {{ $g.billing.intervalSeconds }}
        value:
          int64Value: {{ $g.billing.intervalSeconds }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-billing-agent
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
    app.kubernetes.io/component: billing-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: billing-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: billing-agent
        # The reporter reads PostgreSQL, which admits Qry's own pods.
        qry.ixen.ai/trusted: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ubbagent
        image: {{ $g.billing.image }}
        env:
        - name: AGENT_CONFIG_FILE
          value: /etc/ubbagent/config.yaml
        - name: AGENT_STATE_DIR
          value: /var/lib/ubbagent
        - name: AGENT_LOCAL_PORT
          value: {{ $g.billing.port | quote }}
        - name: AGENT_ENCODED_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $g.reportingSecret }}
              key: reporting-key
        - name: AGENT_CONSUMER_ID
          valueFrom:
            secretKeyRef:
              name: {{ $g.reportingSecret }}
              key: consumer-id
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/ubbagent
        - name: state
          mountPath: /var/lib/ubbagent
      - name: reporter
        image: {{ include "qry.backendImage" . }}
        {{- include "qry.backendContainerSecurityContext" . | nindent 8 }}
        imagePullPolicy: {{ include "qry.imagePullPolicy" . }}
        command: ["python", "-m", "app.marketplace_reporter"]
        envFrom:
        - secretRef:
            name: qry-backend-secrets
        {{- include "qry.existingSecretEnvFrom" $ | nindent 8 }}
        env:
        - name: QRY_BILLING_AGENT_URL
          value: {{ printf "http://localhost:%v" $g.billing.port | quote }}
        # Google's answer on the entitlement comes from Service Control itself
        # with the reporting key, not from the agent (metering.py).
        - name: QRY_MARKETPLACE_REPORTING_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $g.reportingSecret }}
              key: reporting-key
        - name: QRY_MARKETPLACE_CONSUMER_ID
          valueFrom:
            secretKeyRef:
              name: {{ $g.reportingSecret }}
              key: consumer-id
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: {{ .Release.Name }}-billing-agent
      - name: state
        emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-billing-agent-no-ingress
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: billing-agent
  policyTypes: [Ingress]
{{- end }}

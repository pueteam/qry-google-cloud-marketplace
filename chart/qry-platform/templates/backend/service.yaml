{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: qry-backend
  namespace: {{ include "qry.namespace" . }}
  labels:
    {{- include "qry.backend.labels" . | nindent 4 }}
    {{- include "qry.backend.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "qry.backend.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.backend.service.port }}
    targetPort: 8000
  type: {{ .Values.backend.service.type }}
{{- end }}
